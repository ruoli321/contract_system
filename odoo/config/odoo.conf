[options]
# ── Addons ──
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

# ── PostgreSQL ──
# 注意：实际连接参数通过 Docker 环境变量注入（HOST/PORT/USER/PASSWORD），
# 此处仅兜底默认值。如果 .env 中 POSTGRES_* 变量已配置则以容器环境为准。
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = contract_db

# ── 超级管理员密码 ──
# 留空则 Odoo 会要求首次启动时手动设置，或在 docker-compose.yml 中通过
# environment: ADMIN_PASSWD=your-password 注入
# 生产环境强烈建议在 .env 中配置后注入
admin_passwd =

# ── HTTP ──
http_port = 8069
proxy_mode = False

# ── 日志 ──
logfile = /var/log/odoo/odoo-server.log
log_level = info
