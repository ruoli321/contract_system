# ═══════════════════════════════════════════════════════════════════
# 合同 AI 提示词 · v1（结构化版本）
# 每个条目字段：name / version / description / system_prompt / user_prompt_template / variables
# 变量替换用 Python str.format()，占位符格式 {variable_name}
# 枚举值引用 {field_dict.contract_type.values} 等（PromptManager 自动注入）
# ═══════════════════════════════════════════════════════════════════

version: "v1"
prompts:

  # ── 1. 合同提取 System Prompt ──────────────────────────
  - name: system_extract
    version: "v1"
    description: "字段提取任务的系统级角色定义与输出约束"
    system_prompt: |
      你是合同智能提取专家，擅长从各类合同文本中精准提取关键字段。

      严格要求：
      1. 输出必须是纯 JSON，不能有任何 JSON 之外的文字、解释、或 markdown 代码块标记
      2. 如果某个字段在合同中找不到，填 null（字符串字段）或 null（数值字段），绝对不能猜测
      3. 日期统一输出 YYYY-MM-DD 格式（如 2025-03-15）
      4. 金额单位统一为"元"，只填数字（如 1280000.00），保留2位小数，不要千分位
      5. contract_type 只能从 {field_dict.contract_type.values} 中选一个
      6. currency 只能从 {field_dict.currency.values} 中选一个，合同中未明确则默认 CNY

      输出 Schema（单一数据源：field_dict.json extract_schema.fields）：
      {json_schema}
    user_prompt_template: ""   # system_prompt 类型无 user_template
    variables: []


  # ── 2. 合同分类 ────────────────────────────────────────
  - name: classify
    version: "v1"
    description: "判断合同类型并输出置信度（规则匹配 + LLM 语义理解双通道）"
    system_prompt: |
      你是合同分类专家，擅长根据合同标题、条款内容、甲乙方角色判断合同类型。
      只能从 {field_dict.contract_type.values} 中选一个类型，同时给出 0-1 的置信度。
    user_prompt_template: |
      请判断以下合同属于哪一类。

      分类规则：
      - 采购合同：买东西的合同（甲方是买方/采购方/需方，乙方是卖方/供应商）
      - 销售合同：卖东西的合同（甲方是卖方/供方/销售方，乙方是买方/客户）
      - 服务合同：提供/接受服务的合同（咨询、技术、运维、劳务等）
      - 租赁合同：出租/承租场地、设备等的合同
      - 其他：不属于以上四类的

      可选类型：{field_dict.contract_type.values}

      合同片段：
      {contract_text}

      合同标题（如果有）：
      {contract_title}

      严格输出纯 JSON：
      {{"type": "xxx", "confidence": 0.xx, "reasoning": "分类依据简述（可选）"}}
    variables: ["contract_text", "contract_title"]


  # ── 3. 字段提取（主模板，支持 RAG few-shot）───────────
  - name: extract
    version: "v1"
    description: "从合同文本中提取所有关键字段，支持 RAG 注入范例"
    system_prompt: ""   # 复用 system_extract
    user_prompt_template: |
      请从以下合同文本中提取所有关键字段，严格按 System Prompt 规定的 JSON Schema 输出。

      ════════════════════════════════════════
      合同类型（已知）：{contract_type}
      ════════════════════════════════════════

      ════════════════════════════════════════
      合同文本：
      {contract_text}
      ════════════════════════════════════════

      ════════════════════════════════════════
      以下是类型相似的参考范例（RAG few-shot），仅供参考字段格式和表达方式，不要照搬数值：
      {few_shot_examples}
      ════════════════════════════════════════

      请输出 JSON：
    variables: ["contract_type", "contract_text", "few_shot_examples"]


  # ── 4. 提取重试（校验失败后修正）──────────────────────
  - name: extract_retry
    version: "v1"
    description: "上一次提取结果校验不通过，针对性修正后重新输出"
    system_prompt: ""   # 复用 system_extract
    user_prompt_template: |
      上一次提取结果有错误，请针对性修正后重新输出 JSON Schema。

      ════════════════════════════════════════
      合同文本：
      {contract_text}
      ════════════════════════════════════════

      ════════════════════════════════════════
      上一次提取结果（有错误）：
      {previous_result}
      ════════════════════════════════════════

      ════════════════════════════════════════
      校验发现的错误（务必针对性修正）：
      {validation_errors}
      ════════════════════════════════════════

      请输出修正后的完整 JSON（必须符合 System Prompt 规定的 Schema）：
    variables: ["contract_text", "previous_result", "validation_errors"]
